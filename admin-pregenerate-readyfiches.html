<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-génération Fiche Prête (admin)</title>
<style>
  body{ font-family: 'Poppins', Arial, sans-serif; max-width:640px; margin:0 auto; padding:16px; background:#f5f6fa; color:#1B2740; }
  h1{ font-size:18px; } h2{ font-size:15px; margin-top:28px; }
  .card{ background:#fff; border-radius:10px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  input{ width:100%; padding:10px; border:1px solid #ccc; border-radius:7px; box-sizing:border-box; margin-bottom:8px; }
  button{ padding:10px 16px; border:none; border-radius:7px; background:#2557C7; color:#fff; font-weight:600; cursor:pointer; }
  button:disabled{ opacity:.5; }
  button.secondary{ background:#6B6E73; }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eee; font-size:13px; }
  .row:last-child{ border-bottom:none; }
  .status{ font-weight:600; }
  .status.ok{ color:#1a9d4b; } .status.err{ color:#c0392b; } .status.pending{ color:#999; } .status.run{ color:#2557C7; }
  #log{ font-size:12px; color:#555; white-space:pre-wrap; max-height:160px; overflow:auto; background:#fafafa; padding:8px; border-radius:6px; }
</style>
</head>
<body>
<h1>Pré-génération des PDF — Fiche Prête</h1>
<p style="font-size:13px; color:#555;">Génère UNE FOIS POUR TOUTES le PDF de base (sans nom d'enseignant) de chaque matière de CM1 et CM2, et le stocke dans R2. À relancer uniquement quand le contenu d'une matière change.</p>

<div class="card">
  <input type="email" id="email" placeholder="Email admin">
  <input type="password" id="password" placeholder="Mot de passe admin">
  <button onclick="login()">Se connecter</button>
  <div id="loginMsg" style="font-size:12px; margin-top:6px;"></div>
</div>

<div class="card" id="runCard" style="display:none;">
  <button onclick="runAll('CM1')">Générer tout CM1</button>
  <button onclick="runAll('CM2')" style="margin-left:8px;">Générer tout CM2</button>
  <button class="secondary" onclick="stopRun()" style="margin-left:8px;">Stop</button>
  <div id="progress" style="margin-top:10px; font-size:13px;"></div>
</div>

<div class="card" id="listCard" style="display:none;">
  <h2 id="listTitle"></h2>
  <div id="list"></div>
</div>

<div class="card">
  <div id="log"></div>
</div>

<script>
const MATIERE_LISTS = {"CM1": [{"key": "communicationOrale", "label": "COMMUNICATION ORALE", "n": 16}, {"key": "conjugaison", "label": "CONJUGAISON", "n": 24}, {"key": "eaChant", "label": "ÉDUCATION ARTISTIQUE : CHANT", "n": 18}, {"key": "eaConte", "label": "ÉDUCATION ARTISTIQUE : CONTE", "n": 27}, {"key": "eaCouture", "label": "ÉDUCATION ARTISTIQUE : COUTURE", "n": 18}, {"key": "eaDessin", "label": "ÉDUCATION ARTISTIQUE : DESSIN", "n": 36}, {"key": "eaPoesie", "label": "ÉDUCATION ARTISTIQUE : POÉSIE", "n": 18}, {"key": "eps", "label": "ÉDUCATION PHYSIQUE ET SPORTIVE (EPS)", "n": 45}, {"key": "esCivisme", "label": "ÉDUCATION SOCIALE : CIVISME", "n": 48}, {"key": "esGeographie", "label": "ÉDUCATION SOCIALE : GÉOGRAPHIE", "n": 42}, {"key": "esHistoire", "label": "ÉDUCATION SOCIALE : HISTOIRE", "n": 19}, {"key": "esLangueNationale", "label": "ÉDUCATION SOCIALE : LANGUE NATIONALE", "n": 9}, {"key": "esMorale", "label": "ÉDUCATION SOCIALE : MORALE", "n": 20}, {"key": "est", "label": "ÉDUCATION SCIENTIFIQUE ET TECHNOLOGIQUE (EST)", "n": 48}, {"key": "expressionEcrite1erJet", "label": "EXPRESSION ÉCRITE (1ER JET)", "n": 12}, {"key": "expressionEcriteCompteRendu", "label": "EXPRESSION ÉCRITE (COMPTE RENDU)", "n": 12}, {"key": "expressionEcriteImpregnation", "label": "EXPRESSION ÉCRITE (IMPRÉGNATION)", "n": 12}, {"key": "expressionEcriteMiseAuPropre", "label": "EXPRESSION ÉCRITE (MISE AU PROPRE)", "n": 12}, {"key": "grammaire", "label": "GRAMMAIRE", "n": 24}, {"key": "graphismeEcriture", "label": "GRAPHISME-ÉCRITURE", "n": 48}, {"key": "lectureLibre", "label": "LECTURE LIBRE", "n": 5}, {"key": "lectureOralisee", "label": "LECTURE ORALISÉE", "n": 18}, {"key": "lectureSilencieuse", "label": "LECTURE SILENCIEUSE", "n": 21}, {"key": "lectureSpeaker", "label": "LECTURE SPEAKER", "n": 8}, {"key": "mathematique", "label": "MATHÉMATIQUE", "n": 84}, {"key": "orthographe", "label": "ORTHOGRAPHE", "n": 26}, {"key": "vocabulaireFonctionnel", "label": "VOCABULAIRE FONCTIONNEL", "n": 12}, {"key": "vocabulaireSystematique", "label": "VOCABULAIRE SYSTÉMATIQUE", "n": 12}, {"key": "vocabulaireThematique", "label": "VOCABULAIRE THÉMATIQUE", "n": 7}], "CM2": [{"key": "communicationOrale", "label": "COMMUNICATION ORALE", "n": 20}, {"key": "conjugaison", "label": "CONJUGAISON", "n": 23}, {"key": "eaChant", "label": "ÉDUCATION ARTISTIQUE : CHANT", "n": 9}, {"key": "eaConte", "label": "ÉDUCATION ARTISTIQUE : CONTE", "n": 9}, {"key": "eaCouture", "label": "ÉDUCATION ARTISTIQUE : COUTURE", "n": 22}, {"key": "eaDessin", "label": "ÉDUCATION ARTISTIQUE : DESSIN", "n": 16}, {"key": "eaPoesie", "label": "ÉDUCATION ARTISTIQUE : POÉSIE", "n": 9}, {"key": "ecriture", "label": "ÉCRITURE", "n": 23}, {"key": "eps", "label": "ÉDUCATION PHYSIQUE ET SPORTIVE (EPS)", "n": 47}, {"key": "esCivisme", "label": "ES CIVISME", "n": 31}, {"key": "esGeographie", "label": "ES GÉOGRAPHIE", "n": 42}, {"key": "esHistoire", "label": "ES HISTOIRE", "n": 27}, {"key": "esMorale", "label": "ES MORALE", "n": 25}, {"key": "est", "label": "ÉDUCATION SCIENTIFIQUE ET TECHNOLOGIQUE (EST)", "n": 41}, {"key": "expressionEcrite1erJet", "label": "EXPRESSION ÉCRITE (1ER JET)", "n": 13}, {"key": "expressionEcriteCompteRendu", "label": "EXPRESSION ÉCRITE (COMPTE RENDU)", "n": 11}, {"key": "expressionEcriteImpregnation", "label": "EXPRESSION ÉCRITE (IMPRÉGNATION)", "n": 6}, {"key": "expressionEcriteMiseAuPropre", "label": "EXPRESSION ÉCRITE (MISE AU PROPRE)", "n": 11}, {"key": "grammaire", "label": "GRAMMAIRE", "n": 25}, {"key": "lectureImpregnation", "label": "LECTURE (IMPRÉGNATION)", "n": 6}, {"key": "lectureLibre", "label": "LECTURE LIBRE OU PERSONNALISÉE", "n": 4}, {"key": "lectureOralisee", "label": "LECTURE ORALISÉE", "n": 17}, {"key": "lectureRecherche", "label": "LECTURE RECHERCHE", "n": 4}, {"key": "lectureSilencieuse", "label": "LECTURE SILENCIEUSE", "n": 12}, {"key": "lectureSpeaker", "label": "LECTURE DU SPEAKER", "n": 1}, {"key": "mathematique", "label": "MATHÉMATIQUE", "n": 81}, {"key": "orthographe", "label": "ORTHOGRAPHE", "n": 24}, {"key": "vocabulaireFonctionnel", "label": "VOCABULAIRE FONCTIONNEL", "n": 12}, {"key": "vocabulaireSystematique", "label": "VOCABULAIRE SYSTÉMATIQUE", "n": 12}, {"key": "vocabulaireThematique", "label": "VOCABULAIRE THÉMATIQUE", "n": 7}]};
let token = null;
let stopFlag = false;

function log(msg){
  const el = document.getElementById('log');
  el.textContent = (new Date().toLocaleTimeString() + '  ' + msg + '\n') + el.textContent;
}

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/admin-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
  const data = await res.json();
  if(data.ok && data.token){
    token = data.token;
    document.getElementById('loginMsg').textContent = 'Connecté ✓';
    document.getElementById('runCard').style.display = 'block';
  } else {
    document.getElementById('loginMsg').textContent = data.error || 'Échec de connexion';
  }
}

function renderList(classe, statuses){
  document.getElementById('listCard').style.display = 'block';
  document.getElementById('listTitle').textContent = 'Matières ' + classe;
  const el = document.getElementById('list');
  el.innerHTML = MATIERE_LISTS[classe].map(m => {
    const st = statuses[m.key] || 'pending';
    const label = st==='ok' ? 'OK' : st==='err' ? 'Erreur' : st==='run' ? 'En cours…' : 'En attente';
    return '<div class="row" id="row-'+m.key+'"><span>'+m.label+' ('+m.n+' fiches)</span><span class="status '+st+'">'+label+'</span></div>';
  }).join('');
}

function setStatus(key, st){
  const row = document.getElementById('row-'+key);
  if(!row) return;
  const span = row.querySelector('.status');
  span.className = 'status ' + st;
  span.textContent = st==='ok' ? 'OK' : st==='err' ? 'Erreur' : st==='run' ? 'En cours…' : 'En attente';
}

function stopRun(){ stopFlag = true; log('Arrêt demandé — la matière en cours ira à son terme.'); }

async function runAll(classe){
  if(!token){ alert('Connecte-toi d\'abord.'); return; }
  stopFlag = false;
  const statuses = {};
  renderList(classe, statuses);
  const mats = MATIERE_LISTS[classe];
  let done = 0, errors = 0;
  for(const m of mats){
    if(stopFlag) break;
    setStatus(m.key, 'run');
    document.getElementById('progress').textContent = 'Matière ' + (done+1) + '/' + mats.length + ' — ' + m.label;
    try{
      const res = await fetch('/api/admin-pregenerate-readyfiches', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, classe, matiere: m.key })
      });
      const data = await res.json();
      if(data.ok){
        setStatus(m.key, 'ok');
        log(classe+'/'+m.key+' OK — '+data.ficheCount+' fiches, '+Math.round(data.pdfBytes/1024)+' Ko');
      } else {
        setStatus(m.key, 'err');
        errors++;
        log(classe+'/'+m.key+' ERREUR: '+(data.error||'inconnue'));
      }
    }catch(e){
      setStatus(m.key, 'err');
      errors++;
      log(classe+'/'+m.key+' ERREUR réseau: '+e.message);
    }
    done++;
  }
  document.getElementById('progress').textContent = 'Terminé : '+done+'/'+mats.length+' matières traitées, '+errors+' erreur(s).';
}
</script>
</body>
</html>
