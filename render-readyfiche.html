<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rendu Fiche Prête (interne)</title>
<style>
  @page { size: A4; margin: 15mm 10mm 14mm 10mm; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#fff; }
  body{ font-family: Georgia, 'Times New Roman', serif; font-size:13.5px; line-height:1.5; color:#000; }
  .frame{ border: 2.5px solid #111; padding: 12px; }
  .toprow{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:6px; }
  .title{ text-align:center; border:1.5px solid #111; padding:6px 10px; font-weight:bold; font-size:18px; margin-bottom:8px; letter-spacing:.02em; }
  .metaline{ margin: 3px 0; font-size:13px; }
  .metaline b{ text-decoration: underline; }
  .deroulement{ text-align:center; font-weight:bold; letter-spacing:.06em; margin: 12px 0 6px; font-size:22px; text-transform:uppercase; }
  table{ width:100%; border-collapse:collapse; border:2px solid #111; }
  thead{ display: table-header-group; }
  th{ border:2px solid #111; padding:5px; font-size:12.5px; letter-spacing:.08em; font-style:italic; background:#EFEFEF; }
  td{ border-left:2px solid #111; border-right:2px solid #111; border-top:1px solid #ccc; vertical-align:top; padding:6px 8px; page-break-inside:avoid; }
  td.td-consignes{ width:75%; }
  td.td-resultats{ width:25%; text-align:center; }
  .sub-title{ font-weight:bold; font-style:italic; text-decoration:underline; display:block; margin-top:5px; font-size:12.5px; }
  .body-text{ white-space:pre-wrap; margin: 2px 0 6px; font-size:12.5px; }
  .fiche-footer{ text-align:center; font-size:10px; color:#555; margin-top:10px; }
  .bandeau{ text-align:center; font-weight:bold; padding-top:10px; }
</style>
</head>
<body>
<div id="root">Chargement…</div>
<script src="ready-fiches-data.js"></script>
<script>
const MATIERE_DOSSIER_SEULE = 'mathematique';
const MATIERES_SANS_UNITE = ['esCivisme','esMorale','esGeographie','esHistoire','est'];
let CURRENT_FICHES = [];

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderFicheFieldHtml(text){
  const raw = String(text || '');
  const lines = raw.split('\n');
  let html = '';
  let lineBuf = [];
  let colBuf = [];
  const flushLines = () => {
    if(lineBuf.length){ html += lineBuf.map(l => escapeHtml(l)).join('<br>'); lineBuf = []; }
  };
  const flushCols = () => {
    if(colBuf.length){
      const rows = colBuf.map((cells,i) => {
        const tag = i===0 ? 'th' : 'td';
        return `<tr>${cells.map(c => `<${tag}>${escapeHtml(c.trim())}</${tag}>`).join('')}</tr>`;
      }).join('');
      html += `<table class="resume-coltable">${rows}</table>`;
      colBuf = [];
    }
  };
  lines.forEach(line => {
    const trimmed = line.trim();
    if(trimmed === '') return;
    if(trimmed.includes('|')){ flushLines(); colBuf.push(trimmed.split('|')); }
    else { flushCols(); lineBuf.push(trimmed); }
  });
  flushCols(); flushLines();
  return html || '—';
}

function buildFicheHeaderBlockHtml(f){
  const h = f.header;
  const hideUnite = f.subjectKey === MATIERE_DOSSIER_SEULE || MATIERES_SANS_UNITE.includes(f.subjectKey);
  const hideDossier = f.subjectKey !== MATIERE_DOSSIER_SEULE;
  const uniteSpan = hideUnite ? '' : `<span style="display:inline-block; margin-right:26px;"><b>UNITÉ:</b> ${escapeHtml(h.theme)}</span>`;
  const dossierSpan = hideDossier ? '' : `<span style="display:inline-block;"><b>DOSSIER:</b> ${escapeHtml(h.dossier)}</span>`;
  const uniteDossierLine = (uniteSpan || dossierSpan) ? `<div class="metaline">${uniteSpan}${dossierSpan}</div>` : '';
  return `
      <div class="toprow">
        <span><b>Fiche N°</b> ${escapeHtml(h.fn)}</span>
        <span><b>COURS:</b> ${escapeHtml(h.cours)}</span>
      </div>
      <div class="title">FICHE DE PRÉPARATION DE ${escapeHtml(h.matiere).toUpperCase() || 'LA MATIÈRE'}</div>
      <div class="metaline" data-slot="par" style="text-align:right; font-size:13px;"><b>Par :</b> <span style="font-weight:bold;">&nbsp;</span></div>
      ${uniteDossierLine}
      <div class="metaline">
        <span style="display:inline-block; margin-right:26px;"><b>SA N°</b> ${escapeHtml(h.saNumero)}</span>
        <span style="display:inline-block; margin-right:26px;"><b>Séance N°</b> ${escapeHtml(h.seanceNumero)}</span>
        <span style="display:inline-block;"><b>Durée:</b> ${escapeHtml(h.duree)}</span>
      </div>
      <div class="metaline" style="border:1px solid #999; background:#EFEFEF; padding:4px 8px; border-radius:3px; text-align:center;"><span style="font-weight:bold;">${escapeHtml((h.titre||"").toUpperCase())}</span></div>
      <div class="metaline"><b>Compétence disciplinaire:</b> ${escapeHtml(h.competenceDisciplinaire)}</div>
      <div class="metaline"><b>Compétences TV-CTD:</b> ${escapeHtml(h.competencesTvCtd)}</div>
      <div class="metaline"><b>Connaissances et techniques:</b> ${escapeHtml(h.connaissancesTechniques)}</div>
      <div class="metaline"><b>Stratégies d'Ens/App/Eval:</b> ${escapeHtml(h.strategies)}</div>
      <div class="metaline"><b>Matériel:</b> ${escapeHtml(h.materiel)}</div>
      <div class="deroulement">DÉROULEMENT</div>`;
}

function buildFicheRowsHtml(f){
  let rows = '';
  (f.phases||[]).forEach(p => {
    const bandeauTexte = escapeHtml(p.phase||'').toUpperCase() + (p.titre && p.titre.trim() ? ` : ${escapeHtml(p.titre.trim())}` : '');
    rows += `<tr><td colspan="2" class="bandeau">${bandeauTexte}</td></tr>`;
    (p.items||[]).forEach(it => {
      const resultatsStyle = it.label==='Résumé' ? ' style="font-style:italic; font-weight:bold;"' : '';
      rows += `
      <tr>
        <td class="td-consignes">${it.label ? `<span class="sub-title">${escapeHtml(it.label)}</span>` : ''}<div class="body-text"${it.label==='Résumé' ? ' style="font-style:italic; font-weight:bold;"' : ''}>${renderFicheFieldHtml(it.consignes)}</div></td>
        <td class="td-resultats"><div class="body-text"${resultatsStyle}>${renderFicheFieldHtml(it.resultats)}</div></td>
      </tr>`;
    });
  });
  return rows;
}

function buildOneFicheHtml(f){
  return `<div class="frame">
    ${buildFicheHeaderBlockHtml(f)}
    <table><thead><tr><th>CONSIGNES</th><th>RÉSULTATS ATTENDUS</th></tr></thead><tbody>${buildFicheRowsHtml(f)}</tbody></table>
    <div class="fiche-footer">Généré via FicheProBot</div>
  </div>`;
}

// Rend UNE SEULE fiche (index idx dans CURRENT_FICHES) dans #root, pour que
// admin-pregenerate-readyfiches.js appelle page.pdf() fiche par fiche (un
// PDF par fiche, fusionnés ensuite côté serveur avec pdf-lib) — ainsi le
// nombre de pages EXACT consommé par chaque fiche est toujours connu
// (nécessaire pour savoir, dans le PDF fusionné, sur quelle page tamponner
// le nom de l'enseignant — voir meta.pageStarts).
window.renderOneFiche = async function(idx){
  const f = CURRENT_FICHES[idx];
  document.getElementById('root').innerHTML = buildOneFicheHtml(f);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  // Position (en px CSS, relative au viewport = à la zone imprimable, voir
  // setViewport dans admin-pregenerate-readyfiches.js) du champ "Par :" sur
  // la 1ère page de cette fiche — utilisée pour tamponner le nom de
  // l'enseignant au bon endroit, côté client, sans jamais re-générer la
  // mise en page (voir stampReadyFichePdf() dans index.html).
  const parSpan = document.querySelector('[data-slot="par"] span');
  if(!parSpan) return null;
  const rect = parSpan.getBoundingClientRect();
  return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
};

function init(){
  const params = new URLSearchParams(location.search);
  const classe = params.get('classe');
  const matiere = params.get('matiere');
  if(typeof READY_FICHES === 'undefined' || !READY_FICHES[classe] || !READY_FICHES[classe][matiere]){
    document.getElementById('root').textContent = 'INTROUVABLE: ' + classe + ' / ' + matiere;
    window.__RENDER_ERROR__ = true;
    return;
  }
  const entry = READY_FICHES[classe][matiere];
  CURRENT_FICHES = (entry.fiches || []).map(raw => ({
    subjectKey: entry.subjectKey || matiere,
    header: raw.header,
    phases: raw.phases
  }));
  window.__FICHE_COUNT__ = CURRENT_FICHES.length;
  window.__READY_TO_INIT__ = true;
}
init();
</script>
</body>
</html>
