name = "ficheprobot-site"
main = "worker.js"
compatibility_date = "2026-07-21"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "FPB_DB"
database_name = "ficheprobot-db"
database_id = "bf38db8a-a6e9-4f5b-9f34-cc996c123551"

[[r2_buckets]]
binding = "FPB_IMAGES"
bucket_name = "ficheprobot-images"

[ai]
binding = "AI"

# PAS de binding [browser] (Cloudflare Browser Rendering) ici volontairement :
# ça nécessite le plan Workers Paid (5 $/mois minimum). admin-pregenerate-
# readyfiches.js reste dans le code mais échoue proprement (message d'erreur
# explicite) tant que ce binding n'existe pas — donc zéro coût pour toi. Les
# PDF de base "Fiche Prête" pré-générés sont fournis gratuitement par
# ailleurs (voir note dans admin-pregenerate-readyfiches.html) et déposés
# directement dans R2, sans jamais passer par ce binding.
